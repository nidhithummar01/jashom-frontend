<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="ctaBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#0c1929"/>
      <stop offset="100%" stop-color="#051018"/>
    </linearGradient>
    <radialGradient id="ctaGlow1" cx="78%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#0891B2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ctaGlow2" cx="22%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ctaLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="ctaSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="ctaGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#22D3EE" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#ctaBase)"/>
  <rect width="1920" height="1080" fill="url(#ctaGlow1)"/>
  <rect width="1920" height="1080" fill="url(#ctaGlow2)"/>
  <rect width="1920" height="1080" fill="url(#ctaGrid)" opacity="0.9"/>

  <!-- Abstract data streams -->
  <g opacity="0.35" filter="url(#ctaSoft)" fill="none" stroke="url(#ctaLine)" stroke-width="1.2">
    <path d="M200 180 C 520 80, 900 320, 1200 200 S 1700 120, 1850 280"/>
    <path d="M80 620 C 400 520, 780 760, 1100 640 S 1580 560, 1880 720"/>
    <path d="M420 920 C 700 820, 980 980, 1280 860 S 1620 780, 1780 900"/>
  </g>

  <!-- Stylized GPU package (right side, no photo) -->
  <g transform="translate(1180 220)">
    <rect x="0" y="0" width="520" height="640" rx="28" fill="#0f172a" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="24" y="24" width="472" height="592" rx="16" fill="#020617" stroke="#22D3EE" stroke-opacity="0.15"/>
    <!-- Die grid -->
    <g fill="#22D3EE" fill-opacity="0.12">
      <rect x="48" y="48" width="56" height="56" rx="4"/>
      <rect x="112" y="48" width="56" height="56" rx="4"/>
      <rect x="176" y="48" width="56" height="56" rx="4"/>
      <rect x="240" y="48" width="56" height="56" rx="4"/>
      <rect x="304" y="48" width="56" height="56" rx="4"/>
      <rect x="368" y="48" width="56" height="56" rx="4"/>
      <rect x="432" y="48" width="56" height="56" rx="4"/>
      <rect x="48" y="112" width="56" height="56" rx="4"/>
      <rect x="112" y="112" width="56" height="56" rx="4"/>
      <rect x="176" y="112" width="56" height="56" rx="4"/>
      <rect x="240" y="112" width="56" height="56" rx="4"/>
      <rect x="304" y="112" width="56" height="56" rx="4"/>
      <rect x="368" y="112" width="56" height="56" rx="4"/>
      <rect x="432" y="112" width="56" height="56" rx="4"/>
      <rect x="48" y="176" width="56" height="56" rx="4"/>
      <rect x="112" y="176" width="56" height="56" rx="4"/>
      <rect x="176" y="176" width="56" height="56" rx="4"/>
      <rect x="240" y="176" width="56" height="56" rx="4"/>
      <rect x="304" y="176" width="56" height="56" rx="4"/>
      <rect x="368" y="176" width="56" height="56" rx="4"/>
      <rect x="432" y="176" width="56" height="56" rx="4"/>
      <rect x="48" y="240" width="440" height="200" rx="8" fill="#22D3EE" fill-opacity="0.08"/>
      <rect x="48" y="456" width="128" height="128" rx="6"/>
      <rect x="192" y="456" width="128" height="128" rx="6"/>
      <rect x="336" y="456" width="152" height="128" rx="6"/>
    </g>
    <circle cx="260" cy="360" r="120" fill="none" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="260" cy="360" r="80" fill="none" stroke="#22D3EE" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Accent nodes -->
  <g fill="#22D3EE" fill-opacity="0.5">
    <circle cx="140" cy="200" r="3"/>
    <circle cx="320" cy="140" r="2.5"/>
    <circle cx="900" cy="320" r="2"/>
    <circle cx="1050" cy="180" r="2.5"/>
  </g>
</svg>
